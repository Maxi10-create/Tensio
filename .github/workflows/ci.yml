name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit-Tests (inkl. Build-Prüfung)
        run: npm test
      - name: Build für clasp
        run: npm run build
      - name: Vorschau als Artefakt
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: tensio-preview
          path: dist-preview/index.html
          retention-days: 14
