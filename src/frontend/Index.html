  <?!= include('Styles'); ?>
  <script>
    /* Registry für Ansichten. Jede Ansicht registriert sich hier, Scripts.html startet die App. */
    window.TensioViews = {};
    (function () {
      try {
        var t = localStorage.getItem('tensio.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* Speicher evtl. blockiert */ }
    })();
  </script>
</head>
